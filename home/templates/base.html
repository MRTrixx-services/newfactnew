{% load static %}
<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>New Fact Engineering</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link rel="icon"
          type="image/png"
          href="{% static 'home/images/favicon.jpeg' %}">

    <link rel="apple-touch-icon"
      href="{% static 'home/images/favicon.jpeg' %}">
    <!-- Primary SEO Meta Tags -->
    <meta name="title" content="New Fact Engineering | BIM Modeling & VDC Services">
    <meta name="description" content="New Fact Engineering provides BIM modeling, architectural and structural BIM, MEP coordination, shop drawings and VDC services for AEC firms.">
    <meta name="keywords" content="BIM services India, BIM modeling services, BIM outsourcing company, MEP BIM services, VDC coordination, shop drawings">
    <meta name="robots" content="index, follow">
    <meta name="author" content="New Fact Engineering">

    <!-- Canonical URL -->
    <!-- Canonical URL -->
    <link rel="canonical" href="{{ request.scheme }}://{{ request.get_host }}{{ request.path }}">

    <!-- Open Graph Meta Tags -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="New Fact Engineering | BIM Modeling & VDC Services">
    <meta property="og:description" content="Professional BIM modeling, VDC coordination and shop drawing services for AEC firms.">
    <meta property="og:url" content="https://newfactengineering.com/">
    <meta property="og:site_name" content="New Fact Engineering">

    <!-- Twitter Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="New Fact Engineering | BIM Services">
    <meta name="twitter:description" content="BIM modeling, VDC coordination and engineering services for AEC firms.">
    <!-- MAIN CSS -->
    <link rel="stylesheet"
          href="{% static 'home/css/style.css' %}">
    <link rel="stylesheet" href="{% static 'home/css/navbar.css' %}">

    <link rel="stylesheet" href="{% static 'home/css/footer.css' %}">

    {% block extra_css %}
    {% endblock %}

</head>

<body>

    {% include 'components/navbar.html' %}

    {% block content %}{% endblock %}

    {% include 'components/footer.html' %}
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
   <script>
document.addEventListener("DOMContentLoaded", function () {

    document.querySelectorAll("video").forEach(video => {

        video.muted = true;
        video.setAttribute("muted", "");

        video.setAttribute("autoplay", "");
        video.setAttribute("playsinline", "");
        video.setAttribute("webkit-playsinline", "");

        let playPromise = video.play();

        if (playPromise !== undefined) {
            playPromise.catch(() => {});
        }

    });

});
</script>
</body>


</html>
